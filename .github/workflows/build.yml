name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      static:
        description: 'Link LLVM statically (used for release artifacts)'
        type: boolean
        default: true

jobs:
  build:
    # workflow_call input defaults are NOT applied to push/pull_request runs
    # (inputs.static is null there). Fall back to 'true' so those runs also build
    # static; a caller can still pass static explicitly. Note: because GitHub
    # coerces null == false, an explicit `static: false` from a caller cannot be
    # distinguished from "unset" via ||, so this effectively makes static the
    # default everywhere (the only caller, release.yml, passes true anyway).
    env:
      STATIC: ${{ inputs.static || 'true' }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
          # - os: macos-latest
          #   target: macos-arm64
          # - os: macos-13
          #   target: macos-amd64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install LLVM (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-21 main"
          sudo apt-get update
          sudo apt-get install -y llvm-21-dev

      - name: Install static link dependencies (Linux)
        if: ${{ runner.os == 'Linux' && env.STATIC == 'true' }}
        run: sudo apt-get install -y zlib1g-dev libzstd-dev libtinfo-dev libxml2-dev

      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm@21

      - name: Build (dynamic)
        if: ${{ env.STATIC != 'true' }}
        run: odin build . -out:zero -o:speed

      - name: Build (static LLVM)
        if: ${{ env.STATIC == 'true' }}
        run: LLVM_CONFIG=llvm-config-21 bash build-static.sh

      - name: Package
        run: |
          mkdir -p zero-${{ matrix.target }}
          cp zero zero-${{ matrix.target }}/
          cp -r runtime std vendor demos tests zero-${{ matrix.target }}/
          tar czf zero-${{ matrix.target }}.tar.gz zero-${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zero-${{ matrix.target }}
          path: zero-${{ matrix.target }}.tar.gz
